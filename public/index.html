<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECHSAVVY AI</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161923;
    --panel-2: #1c2030;
    --border: #2a2f42;
    --text: #e6e8f0;
    --text-dim: #8b91a7;
    --accent: #00d4ff;
    --accent-2: #7c5cff;
    --user-bubble: #2563eb;
    --bot-bubble: #23283a;
    --danger: #ff5c7a;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    background: radial-gradient(circle at top, #171a26 0%, #0b0d13 70%);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  header {
    padding: 18px 24px;
    background: linear-gradient(90deg, rgba(0,212,255,0.08), rgba(124,92,255,0.08));
    border-bottom: 1px solid var(--border);
    text-align: center;
    flex-shrink: 0;
  }

  header h1 {
    margin: 0;
    font-size: 1.6rem;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p {
    margin: 4px 0 0;
    font-size: 0.85rem;
    color: var(--text-dim);
  }

  /* ---------- Chat container ---------- */
  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }

  #chat-container::-webkit-scrollbar {
    width: 8px;
  }
  #chat-container::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 8px;
  }

  .message {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 0.96rem;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: fadeIn 0.25s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .message.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .message.bot.error {
    border-color: var(--danger);
    color: var(--danger);
  }

  .message .label {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    opacity: 0.6;
    margin-bottom: 4px;
  }

  .typing-indicator {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
  }

  .typing-indicator span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  /* ---------- Input bar ---------- */
  #input-bar {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 20px;
  }

  #input-inner {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 10px;
  }

  #input-inner:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,212,255,0.15);
  }

  #message-input {
    flex: 1;
    resize: none;
    max-height: 140px;
    min-height: 24px;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
    padding: 6px 4px;
    line-height: 1.4;
  }

  #message-input::placeholder {
    color: var(--text-dim);
  }

  #send-btn {
    flex-shrink: 0;
    border: none;
    outline: none;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b0d13;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 10px 18px;
    border-radius: 10px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  #send-btn:hover:not(:disabled) {
    transform: translateY(-1px);
  }

  #send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ---------- Hero (shown before first message) ---------- */
  #hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    text-align: center;
    padding: 40px 20px;
    gap: 12px;
  }

  #hero h1 {
    margin: 0;
    font-size: 2.4rem;
    letter-spacing: 1px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  #hero .powered {
    font-size: 0.95rem;
    color: var(--text-dim);
    margin: 0;
  }

  #hero .ask-anything {
    margin-top: 8px;
    font-size: 1.1rem;
    color: var(--text);
    opacity: 0.75;
  }

  #hero .glow-ring {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,212,255,0.15), transparent 70%);
    border: 2px solid rgba(0,212,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.6rem;
    margin-bottom: 8px;
    box-shadow: 0 0 24px rgba(0,212,255,0.2);
  }

  @media (max-width: 600px) {
    .message { max-width: 88%; }
    #hero h1 { font-size: 1.7rem; }
    #input-bar { padding: 10px 12px; }
  }
</style>
</head>
<body>

  <div id="hero">
    <div class="glow-ring">⚡</div>
    <h1>TECHSAVVY AI</h1>
    <p class="powered">Powered by Mistral AI</p>
    <p class="ask-anything">Ask me anything — ROMs, mods, retro tech, or just vibe 🤙</p>
  </div>

  <div id="chat-container" style="display:none;"></div>

  <div id="input-bar">
    <div id="input-inner">
      <textarea
        id="message-input"
        placeholder="Ask TECHSAVVY AI something..."
        rows="1"
      ></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const hero = document.getElementById('hero');

    function showChat() {
      if (hero.style.display !== 'none') {
        hero.style.display = 'none';
        chatContainer.style.display = 'flex';
      }
    }

    // Full conversation history sent to the backend (role/content pairs)
    let conversationHistory = [];

    // ---- Auto-resize textarea ----
    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 140) + 'px';
    });

    // ---- Enter to send, Shift+Enter for newline ----
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    function appendMessage(role, text, isError = false) {
      const div = document.createElement('div');
      div.className = `message ${role === 'user' ? 'user' : 'bot'}${isError ? ' error' : ''}`;

      if (role !== 'user') {
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = 'TECHSAVVY AI';
        div.appendChild(label);
        div.appendChild(document.createTextNode(text));
      } else {
        div.textContent = text;
      }

      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    function showTypingIndicator() {
      const el = document.createElement('div');
      el.className = 'typing-indicator';
      el.id = 'typing-indicator';
      el.innerHTML = '<span></span><span></span><span></span>';
      chatContainer.appendChild(el);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      // Show user message (hide hero first)
      showChat();
      appendMessage('user', text);
      conversationHistory.push({ role: 'user', content: text });

      // Reset input
      messageInput.value = '';
      messageInput.style.height = 'auto';
      sendBtn.disabled = true;

      showTypingIndicator();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: conversationHistory })
        });

        const data = await res.json();
        removeTypingIndicator();

        if (!res.ok) {
          appendMessage('bot', data.error || 'Something went wrong.', true);
          return;
        }

        appendMessage('bot', data.reply);
        conversationHistory.push({ role: 'assistant', content: data.reply });

      } catch (err) {
        removeTypingIndicator();
        appendMessage(
          'bot',
          "oh noooooo! mah circuit decided to short out processing thet request. check ur api key or try again in a second! :(",
          true
        );
      } finally {
        sendBtn.disabled = false;
        messageInput.focus();
      }
    }
  </script>

</body>
</html>
