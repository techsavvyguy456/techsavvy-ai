<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TECHSAVVY AI</title>
<!-- Markdown renderer -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<!-- LaTeX renderer -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161923;
    --panel-2: #1c2030;
    --border: #2a2f42;
    --text: #e6e8f0;
    --text-dim: #8b91a7;
    --accent: #00d4ff;
    --accent-2: #7c5cff;
    --user-bubble: #2563eb;
    --bot-bubble: #23283a;
    --danger: #ff5c7a;
    --sidebar-w: 260px;
    --discord: #5865f2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    height: 100dvh;
    overflow: hidden;
  }

  /* ===================== SIDEBAR ===================== */
  #sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 14px 12px;
    gap: 4px;
    overflow: hidden;
    transition: transform 0.25s ease;
    z-index: 100;
  }

  /* Top row: New Chat + Close button */
  .sidebar-top-row {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }

  #new-chat-btn {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--discord);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  #new-chat-btn:hover { opacity: 0.88; }

  #close-sidebar-btn {
    display: none;
    align-items: center;
    justify-content: center;
    background: var(--panel-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 42px;
    height: 42px;
    min-height: 42px;
    min-width: 42px;
    font-size: 1.2rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s, color 0.15s;
    padding: 0;
    line-height: 1;
  }
  #close-sidebar-btn:hover { background: var(--border); color: var(--text); }
  #close-sidebar-btn:active { opacity: 0.7; }

  .sidebar-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    padding: 10px 6px 4px;
    font-weight: 600;
  }

  .suggestion-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 0.88rem;
    color: var(--text);
    transition: background 0.15s;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
    line-height: 1.3;
  }
  .suggestion-item:hover { background: var(--panel-2); }
  .suggestion-item .icon { font-size: 1rem; flex-shrink: 0; }

  .sidebar-spacer { flex: 1; }

  .sidebar-footer {
    border-top: 1px solid var(--border);
    padding-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 9px;
    font-size: 0.9rem;
    color: var(--text-dim);
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
  }
  .sidebar-link:hover { background: var(--panel-2); color: var(--text); }
  .sidebar-link .icon { font-size: 1.1rem; }

  /* ===================== MAIN ===================== */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(circle at top, #171a26 0%, #0b0d13 70%);
    min-width: 0;
  }

  /* Mobile top bar */
  #topbar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }

  #menu-btn {
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    font-size: 1.4rem;
    padding: 4px 6px;
    line-height: 1;
  }

  #topbar-title {
    font-size: 1rem;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* ---- Hero ---- */
  #hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    text-align: center;
    padding: 40px 20px;
    gap: 12px;
  }

  .glow-ring {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,212,255,0.15), transparent 70%);
    border: 2px solid rgba(0,212,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.6rem;
    margin-bottom: 8px;
    box-shadow: 0 0 24px rgba(0,212,255,0.2);
  }

  #hero h1 {
    font-size: 2.2rem;
    letter-spacing: 1px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  #hero .powered { font-size: 0.95rem; color: var(--text-dim); }
  #hero .ask-anything { margin-top: 8px; font-size: 1rem; color: var(--text); opacity: 0.75; }

  /* ---- Chat ---- */
  #chat-wrap {
    flex: 1;
    overflow: hidden;
    display: none;
    flex-direction: column;
  }

  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px 20px 10px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }

  #chat-container::-webkit-scrollbar { width: 6px; }
  #chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  .message {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.6;
    font-size: 0.95rem;
    word-wrap: break-word;
    overflow-wrap: break-word;
    animation: fadeIn 0.22s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
    white-space: pre-wrap;
  }

  .message.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .message.bot.error { border-color: var(--danger); color: var(--danger); }

  .message .label {
    display: block;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    opacity: 0.55;
    margin-bottom: 6px;
  }

  /* Markdown styles inside bot messages */
  .message.bot p { margin-bottom: 0.5em; }
  .message.bot p:last-child { margin-bottom: 0; }
  .message.bot strong { color: #fff; font-weight: 700; }
  .message.bot em { color: var(--accent); font-style: italic; }
  .message.bot h1,.message.bot h2,.message.bot h3 {
    color: var(--accent);
    margin: 0.6em 0 0.3em;
    font-size: 1em;
  }
  .message.bot ul, .message.bot ol {
    padding-left: 1.3em;
    margin: 0.4em 0;
  }
  .message.bot li { margin-bottom: 0.2em; }
  .message.bot code {
    background: rgba(0,0,0,0.35);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.88em;
    color: var(--accent);
  }
  .message.bot pre {
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 0.5em 0;
  }
  .message.bot pre code {
    background: none;
    padding: 0;
    color: #c9d1d9;
    font-size: 0.85em;
  }
  .message.bot blockquote {
    border-left: 3px solid var(--accent-2);
    padding-left: 10px;
    color: var(--text-dim);
    margin: 0.4em 0;
  }
  .message.bot a { color: var(--accent); }
  .message.bot hr { border-color: var(--border); margin: 0.6em 0; }

  /* KaTeX */
  .message.bot .katex { font-size: 1em; }

  /* Cooldown toast */
  #cooldown-toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #2a1a1a;
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 200;
    white-space: nowrap;
  }
  #cooldown-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Typing indicator */
  .typing-indicator {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
  }
  .typing-indicator span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  /* ---- Input bar ---- */
  #input-bar {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }

  #input-inner {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 10px;
  }

  #input-inner:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,212,255,0.12);
  }

  #message-input {
    flex: 1;
    resize: none;
    max-height: 120px;
    min-height: 24px;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
    padding: 5px 4px;
    line-height: 1.4;
    -webkit-appearance: none;
  }
  #message-input::placeholder { color: var(--text-dim); }

  #send-btn {
    flex-shrink: 0;
    border: none;
    outline: none;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b0d13;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 10px 18px;
    border-radius: 10px;
    transition: transform 0.15s ease, opacity 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #send-btn:hover:not(:disabled) { transform: translateY(-1px); }
  #send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* ===================== MOBILE ===================== */
  #sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 99;
  }

  @media (max-width: 680px) {
    #sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      transform: translateX(-100%);
      padding-top: max(14px, env(safe-area-inset-top));
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar-overlay.open { display: block; }
    #close-sidebar-btn { display: flex; }
    #topbar { display: flex; }
    .message { max-width: 90%; font-size: 0.92rem; }
    #hero h1 { font-size: 1.65rem; }
    #hero .ask-anything { font-size: 0.9rem; }
    #input-bar { padding: 10px 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    #chat-container { padding: 14px 12px 8px; }
  }
</style>
</head>
<body>

<!-- ===== SIDEBAR ===== -->
<nav id="sidebar">
  <div class="sidebar-top-row">
    <button id="new-chat-btn" onclick="newChat()">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Chat
    </button>
    <button id="close-sidebar-btn" onclick="closeSidebar()" title="Close sidebar">✕</button>
  </div>

  <div class="sidebar-label">Suggestions</div>

  <button class="suggestion-item" onclick="useSuggestion('What custom ROM should I flash on my Android phone?')">
    <span class="icon">🛠️</span> Custom ROM advice
  </button>
  <button class="suggestion-item" onclick="useSuggestion('How do I sideload an APK on Android?')">
    <span class="icon">📦</span> Sideload an APK
  </button>
  <button class="suggestion-item" onclick="useSuggestion('What are the best retro Android phones to collect?')">
    <span class="icon">📱</span> Retro phone collecting
  </button>
  <button class="suggestion-item" onclick="useSuggestion('Tell me about classic Minecraft Pocket Edition')">
    <span class="icon">🎮</span> Classic Minecraft PE
  </button>
  <button class="suggestion-item" onclick="useSuggestion('How do I revive an old bricked Android device?')">
    <span class="icon">⚡</span> Revive a bricked device
  </button>

  <div class="sidebar-spacer"></div>

  <div class="sidebar-footer">
    <a class="sidebar-link" href="https://discord.gg/FAzYUXGSmF" target="_blank" rel="noopener">
      <span class="icon">💬</span> Discord Server
    </a>
  </div>
</nav>

<!-- Mobile overlay -->
<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- Cooldown toast -->
<div id="cooldown-toast">⏳ Slow down! Wait a moment before sending again.</div>

<!-- ===== MAIN ===== -->
<div id="main">

  <!-- Mobile top bar -->
  <div id="topbar">
    <button id="menu-btn" onclick="openSidebar()">☰</button>
    <span id="topbar-title">⚡ TECHSAVVY AI</span>
  </div>

  <!-- Hero screen -->
  <div id="hero">
    <div class="glow-ring">⚡</div>
    <h1>TECHSAVVY AI</h1>
    <p class="powered">Powered by Mistral AI</p>
    <p class="ask-anything">Ask me anything — ROMs, mods, retro tech, or just vibe 🤙</p>
  </div>

  <!-- Chat wrap -->
  <div id="chat-wrap">
    <div id="chat-container"></div>
  </div>

  <!-- Input -->
  <div id="input-bar">
    <div id="input-inner">
      <textarea id="message-input" placeholder="Ask TECHSAVVY AI something..." rows="1"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>

</div>

<script>
  // ---- Configure marked (markdown parser) ----
  marked.setOptions({ breaks: true, gfm: true });

  const chatContainer = document.getElementById('chat-container');
  const chatWrap      = document.getElementById('chat-wrap');
  const messageInput  = document.getElementById('message-input');
  const sendBtn       = document.getElementById('send-btn');
  const hero          = document.getElementById('hero');
  const sidebar       = document.getElementById('sidebar');
  const overlay       = document.getElementById('sidebar-overlay');
  const cooldownToast = document.getElementById('cooldown-toast');

  // Load conversation history from localStorage or default to empty array
  let conversationHistory = JSON.parse(localStorage.getItem('techsavvy_ai_chat')) || [];

  // ---- Spam cooldown (3 seconds between sends) ----
  const COOLDOWN_MS = 3000;
  let lastSentAt = 0;
  let cooldownTimer = null;

  function showCooldown(remaining) {
    cooldownToast.textContent = `⏳ Chill! Wait ${remaining}s before sending again.`;
    cooldownToast.classList.add('show');
    clearTimeout(cooldownTimer);
    cooldownTimer = setTimeout(() => cooldownToast.classList.remove('show'), 1800);
  }

  // Save history to localStorage (keeps last 20 messages)
  function saveToLocalStorage() {
    if (conversationHistory.length > 20) {
      conversationHistory = conversationHistory.slice(-20);
    }
    localStorage.setItem('techsavvy_ai_chat', JSON.stringify(conversationHistory));
  }

  // Restore existing chat UI if messages exist in localStorage
  function loadFromLocalStorage() {
    if (conversationHistory.length > 0) {
      showChat();
      conversationHistory.forEach(msg => {
        appendMessage(msg.role === 'user' ? 'user' : 'bot', msg.content, false, false);
      });
    }
  }

  // ---- Sidebar ----
  function openSidebar()  { sidebar.classList.add('open'); overlay.classList.add('open'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

  // ---- New chat ----
  function newChat() {
    conversationHistory = [];
    localStorage.removeItem('techsavvy_ai_chat');
    chatContainer.innerHTML = '';
    chatWrap.style.display = 'none';
    hero.style.display = 'flex';
    messageInput.value = '';
    messageInput.style.height = 'auto';
    closeSidebar();
    messageInput.focus();
  }

  // ---- Suggestions ----
  function useSuggestion(text) {
    closeSidebar();
    messageInput.value = text;
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
    sendMessage();
  }

  // ---- Show chat area ----
  function showChat() {
    if (chatWrap.style.display !== 'flex') {
      hero.style.display = 'none';
      chatWrap.style.display = 'flex';
    }
  }

  // ---- Render markdown + LaTeX ----
  function renderBotContent(text) {
    const html = marked.parse(text);
    const div = document.createElement('div');
    div.innerHTML = html;
    // Render LaTeX inside the div
    renderMathInElement(div, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$',  right: '$',  display: false },
        { left: '\\(', right: '\\)', display: false },
        { left: '\\[', right: '\\]', display: true }
      ],
      throwOnError: false
    });
    return div;
  }

  // ---- Append message ----
  function appendMessage(role, text, isError = false, shouldSave = true) {
    const div = document.createElement('div');
    div.className = `message ${role === 'user' ? 'user' : 'bot'}${isError ? ' error' : ''}`;

    if (role !== 'user') {
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = 'TECHSAVVY AI';
      div.appendChild(label);
      if (isError) {
        div.appendChild(document.createTextNode(text));
      } else {
        div.appendChild(renderBotContent(text));
      }
    } else {
      div.textContent = text;
    }

    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;

    if (shouldSave && !isError) {
      saveToLocalStorage();
    }

    return div;
  }

  function showTypingIndicator() {
    const el = document.createElement('div');
    el.className = 'typing-indicator';
    el.id = 'typing-indicator';
    el.innerHTML = '<span></span><span></span><span></span>';
    chatContainer.appendChild(el);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function removeTypingIndicator() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  // ---- Auto-resize textarea ----
  messageInput.addEventListener('input', () => {
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
  });

  // ---- Enter to send (Shift+Enter = newline) ----
  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text) return;

    // Cooldown check
    const now = Date.now();
    const elapsed = now - lastSentAt;
    if (elapsed < COOLDOWN_MS && lastSentAt !== 0) {
      const remaining = Math.ceil((COOLDOWN_MS - elapsed) / 1000);
      showCooldown(remaining);
      return;
    }
    lastSentAt = now;

    showChat();
    conversationHistory.push({ role: 'user', content: text });
    appendMessage('user', text, false, true);

    messageInput.value = '';
    messageInput.style.height = 'auto';
    sendBtn.disabled = true;
    showTypingIndicator();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: conversationHistory })
      });

      const data = await res.json();
      removeTypingIndicator();

      if (!res.ok) {
        // Roll back prompt on error
        conversationHistory.pop();
        appendMessage('bot', data.error || 'Something went wrong.', true, false);
        return;
      }

      conversationHistory.push({ role: 'assistant', content: data.reply });
      appendMessage('bot', data.reply, false, true);

    } catch (err) {
      removeTypingIndicator();
      conversationHistory.pop();
      appendMessage('bot', "oh noooooo! mah circuit decided to short out processing thet request. check ur api key or try again in a second! :(", true, false);
    } finally {
      sendBtn.disabled = false;
      messageInput.focus();
    }
  }

  // Initialize UI on load
  loadFromLocalStorage();
</script>

</body>
</html>
