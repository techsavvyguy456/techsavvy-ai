<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TECHSAVVY AI</title>
<!-- Universal base markdown parser (safe for old & new) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/0.8.2/marked.min.js"></script>

<style>
  :root {
    --bg: #0f1117;
    --panel: #161923;
    --panel-2: #1c2030;
    --border: #2a2f42;
    --text: #e6e8f0;
    --text-dim: #8b91a7;
    --accent: #00d4ff;
    --accent-2: #7c5cff;
    --user-bubble: #2563eb;
    --bot-bubble: #23283a;
    --danger: #ff5c7a;
    --sidebar-w: 260px;
    --discord: #5865f2;
  }

  * { 
    -webkit-box-sizing: border-box;
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }

  html, body { 
    height: 100%; 
    width: 100%;
    position: fixed;
    overflow: hidden;
  }

  body {
    background-color: #0f1117;
    background: var(--bg);
    color: #e6e8f0;
    color: var(--text);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  @supports (height: 100dvh) {
    body { height: 100dvh; }
  }

  /* ===================== SIDEBAR ===================== */
  #sidebar {
    width: 260px;
    min-width: 260px;
    background-color: #161923;
    background: var(--panel);
    border-right: 1px solid #2a2f42;
    border-right: 1px solid var(--border);
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-flex-direction: column;
    flex-direction: column;
    padding: 14px 12px;
    gap: 4px;
    overflow: hidden;
    -webkit-transition: -webkit-transform 0.25s ease;
    transition: transform 0.25s ease;
    z-index: 1000;
  }

  .sidebar-top-row {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }

  #new-chat-btn {
    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    gap: 8px;
    background-color: #5865f2;
    background: var(--discord);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }

  #close-sidebar-btn {
    display: none;
    background-color: #1c2030;
    background: var(--panel-2);
    color: #8b91a7;
    border: 1px solid #2a2f42;
    border-radius: 10px;
    width: 42px;
    height: 42px;
    font-size: 1.2rem;
    cursor: pointer;
    line-height: 40px;
    text-align: center;
  }

  .sidebar-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8b91a7;
    padding: 10px 6px 4px;
    font-weight: 600;
  }

  .suggestion-item {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 0.88rem;
    color: #e6e8f0;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
    line-height: 1.3;
  }
  .suggestion-item:hover, .suggestion-item:active { background-color: #1c2030; }
  .suggestion-item .icon { font-size: 1rem; flex-shrink: 0; }

  .sidebar-spacer { 
    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1; 
  }

  .sidebar-footer {
    border-top: 1px solid #2a2f42;
    padding-top: 10px;
  }

  .sidebar-link {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 9px;
    font-size: 0.9rem;
    color: #8b91a7;
    text-decoration: none;
  }
  .sidebar-link:hover { background-color: #1c2030; color: #e6e8f0; }

  /* ===================== MAIN ===================== */
  #main {
    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-flex-direction: column;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(circle at top, #171a26 0%, #0b0d13 70%);
    background-color: #0b0d13;
    min-width: 0;
    height: 100%;
    position: relative;
  }

  #topbar {
    display: none;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid #2a2f42;
    background-color: #161923;
    flex-shrink: 0;
  }

  #menu-btn {
    background: none;
    border: none;
    color: #e6e8f0;
    cursor: pointer;
    font-size: 1.4rem;
    padding: 4px 6px;
    line-height: 1;
  }

  #topbar-title {
    font-size: 1rem;
    font-weight: 700;
    color: #00d4ff;
  }

  /* ---- Hero ---- */
  #hero {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;
    text-align: center;
    padding: 40px 20px;
    gap: 12px;
  }

  .glow-ring {
    width: 90px; height: 90px;
    border-radius: 50%;
    background-color: rgba(0,212,255,0.15);
    border: 2px solid rgba(0,212,255,0.3);
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    font-size: 2.6rem;
    margin-bottom: 8px;
  }

  #hero h1 {
    font-size: 2.2rem;
    letter-spacing: 1px;
    color: #00d4ff;
  }

  #hero .powered { font-size: 0.95rem; color: #8b91a7; }
  #hero .ask-anything { margin-top: 8px; font-size: 1rem; color: #e6e8f0; opacity: 0.75; }

  /* ---- Chat ---- */
  #chat-wrap {
    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;
    overflow: hidden;
    display: none;
    -webkit-box-orient: vertical;
    -webkit-flex-direction: column;
    flex-direction: column;
    min-height: 0;
  }

  #chat-container {
    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;
    overflow-y: auto;
    padding: 20px 20px 10px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    -webkit-overflow-scrolling: touch;
  }

  .message {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.6;
    font-size: 0.95rem;
    word-wrap: break-word;
    margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }

  .message.user {
    float: right;
    clear: both;
    background-color: #2563eb;
    color: #fff;
    border-bottom-right-radius: 4px;
    white-space: pre-wrap;
  }

  .message.bot {
    float: left;
    clear: both;
    background-color: #23283a;
    color: #e6e8f0;
    border: 1px solid #2a2f42;
    border-bottom-left-radius: 4px;
  }

  .message.bot.error { border-color: #ff5c7a; color: #ff5c7a; }

  .message .label {
    display: block;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: #8b91a7;
    margin-bottom: 6px;
  }

  .message.bot p { margin-bottom: 0.5em; }
  .message.bot p:last-child { margin-bottom: 0; }
  .message.bot strong { color: #fff; font-weight: 700; }
  .message.bot em { color: #00d4ff; font-style: italic; }
  .message.bot ul, .message.bot ol { padding-left: 1.3em; margin: 0.4em 0; }
  .message.bot li { margin-bottom: 0.2em; }
  .message.bot code {
    background: rgba(0,0,0,0.35);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 0.88em;
    color: #00d4ff;
  }
  .message.bot pre {
    background: rgba(0,0,0,0.4);
    border: 1px solid #2a2f42;
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 0.5em 0;
  }

  #cooldown-toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    margin-left: -130px;
    width: 260px;
    background-color: #2a1a1a;
    border: 1px solid #ff5c7a;
    color: #ff5c7a;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    display: none;
    z-index: 2000;
    text-align: center;
  }

  .typing-indicator {
    float: left;
    clear: both;
    padding: 10px 16px;
    background-color: #23283a;
    border: 1px solid #2a2f42;
    border-radius: 16px;
    margin-bottom: 14px;
    color: #8b91a7;
    font-size: 0.85rem;
  }

  /* ---- Input bar ---- */
  #input-bar {
    flex-shrink: 0;
    border-top: 1px solid #2a2f42;
    background-color: #161923;
    padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  }

  #input-inner {
    max-width: 860px;
    margin: 0 auto;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: end;
    -webkit-align-items: flex-end;
    align-items: flex-end;
    gap: 10px;
    background-color: #1c2030;
    border: 1px solid #2a2f42;
    border-radius: 14px;
    padding: 8px 10px;
  }

  #message-input {
    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;
    resize: none;
    max-height: 120px;
    min-height: 24px;
    border: none;
    outline: none;
    background: transparent;
    color: #e6e8f0;
    font-size: 0.95rem;
    font-family: inherit;
    padding: 5px 4px;
    line-height: 1.4;
  }

  #send-btn {
    flex-shrink: 0;
    border: none;
    outline: none;
    cursor: pointer;
    background-color: #00d4ff;
    color: #0b0d13;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 10px 18px;
    border-radius: 10px;
  }
  #send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* Mobile / Tablet overlay (increased breakpoint to 900px) */
  #sidebar-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.55);
    z-index: 999;
  }

  @media (max-width: 900px) {
    #sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      -webkit-transform: translateX(-100%);
      transform: translateX(-100%);
    }
    #sidebar.open { 
      -webkit-transform: translateX(0);
      transform: translateX(0); 
    }
    #sidebar-overlay.open { display: block; }
    #close-sidebar-btn { display: inline-block; }
    #topbar { 
      display: -webkit-box; 
      display: -webkit-flex; 
      display: flex; 
    }
    .message { max-width: 90%; }
    #hero h1 { font-size: 1.65rem; }
  }
</style>
</head>
<body>

<nav id="sidebar">
  <div class="sidebar-top-row">
    <button id="new-chat-btn">
      <span style="font-size:1.1rem; line-height:1;">+</span> New Chat
    </button>
    <button id="close-sidebar-btn">✕</button>
  </div>

  <div class="sidebar-label">Suggestions</div>
  <button class="suggestion-item" data-prompt="What custom ROM should I flash on my Android phone?"><span class="icon">🛠️</span> Custom ROM advice</button>
  <button class="suggestion-item" data-prompt="How do I sideload an APK on Android?"><span class="icon">📦</span> Sideload an APK</button>
  <button class="suggestion-item" data-prompt="What are the best retro Android phones to collect?"><span class="icon">📱</span> Retro phone collecting</button>
  <button class="suggestion-item" data-prompt="Tell me about classic Minecraft Pocket Edition"><span class="icon">🎮</span> Classic Minecraft PE</button>
  <button class="suggestion-item" data-prompt="How do I revive an old bricked Android device?"><span class="icon">⚡</span> Revive a bricked device</button>

  <div class="sidebar-spacer"></div>

  <div class="sidebar-footer">
    <a class="sidebar-link" href="https://discord.gg/FAzYUXGSmF" target="_blank" rel="noopener"><span class="icon">💬</span> Discord Server</a>
  </div>
</nav>

<div id="sidebar-overlay"></div>
<div id="cooldown-toast">⏳ Slow down! Wait a moment.</div>

<div id="main">
  <div id="topbar">
    <button id="menu-btn">☰</button>
    <span id="topbar-title">⚡ TECHSAVVY AI</span>
  </div>

  <div id="hero">
    <div class="glow-ring">⚡</div>
    <h1>TECHSAVVY AI</h1>
    <p class="powered">Powered by Mistral AI</p>
    <p class="ask-anything">Ask me anything — ROMs, mods, retro tech, or just vibe 🤙</p>
  </div>

  <div id="chat-wrap">
    <div id="chat-container"></div>
  </div>

  <div id="input-bar">
    <div id="input-inner">
      <textarea id="message-input" placeholder="Ask TECHSAVVY AI something..." rows="1"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>
</div>

<script>
  var chatContainer = document.getElementById('chat-container');
  var chatWrap = document.getElementById('chat-wrap');
  var messageInput = document.getElementById('message-input');
  var sendBtn = document.getElementById('send-btn');
  var hero = document.getElementById('hero');
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebar-overlay');
  var cooldownToast = document.getElementById('cooldown-toast');
  var menuBtn = document.getElementById('menu-btn');
  var closeSidebarBtn = document.getElementById('close-sidebar-btn');
  var newChatBtn = document.getElementById('new-chat-btn');

  var conversationHistory = [];
  try {
    var stored = localStorage.getItem('techsavvy_ai_chat');
    if (stored) conversationHistory = JSON.parse(stored);
  } catch (e) {}

  var COOLDOWN_MS = 3000;
  var lastSentAt = 0;
  var cooldownTimer = null;

  var isModernEngine = typeof Promise !== 'undefined' && typeof window.fetch !== 'undefined';
  if (isModernEngine) {
    var katexCSS = document.createElement('link');
    katexCSS.rel = 'stylesheet';
    katexCSS.href = 'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css';
    document.head.appendChild(katexCSS);

    var katexJS = document.createElement('script');
    katexJS.src = 'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js';
    katexJS.onload = function() {
      var autoRenderJS = document.createElement('script');
      autoRenderJS.src = 'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js';
      document.head.appendChild(autoRenderJS);
    };
    document.head.appendChild(katexJS);
  }

  function showCooldown(remaining) {
    cooldownToast.innerText = '⏳ Chill! Wait ' + remaining + 's before sending again.';
    cooldownToast.style.display = 'block';
    clearTimeout(cooldownTimer);
    cooldownTimer = setTimeout(function() {
      cooldownToast.style.display = 'none';
    }, 1800);
  }

  function saveToLocalStorage() {
    try {
      if (conversationHistory.length > 20) {
        conversationHistory = conversationHistory.slice(-20);
      }
      localStorage.setItem('techsavvy_ai_chat', JSON.stringify(conversationHistory));
    } catch (e) {}
  }

  function openSidebar() {
    sidebar.className = 'open';
    overlay.className = 'open';
  }

  function closeSidebar() {
    sidebar.className = '';
    overlay.className = '';
  }

  function newChat() {
    conversationHistory = [];
    try { localStorage.removeItem('techsavvy_ai_chat'); } catch (e) {}
    chatContainer.innerHTML = '';
    chatWrap.style.display = 'none';
    hero.style.display = 'flex';
    messageInput.value = '';
    messageInput.style.height = 'auto';
    closeSidebar();
    messageInput.focus();
  }

  function showChat() {
    hero.style.display = 'none';
    chatWrap.style.display = 'flex';
  }

  function renderBotContent(text) {
    var div = document.createElement('div');
    if (window.marked) {
      try {
        div.innerHTML = marked(text);
      } catch (e) {
        div.innerText = text;
      }
    } else {
      div.innerText = text;
    }

    if (window.renderMathInElement) {
      try {
        renderMathInElement(div, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true }
          ],
          throwOnError: false
        });
      } catch (e) {}
    }
    return div;
  }

  function appendMessage(role, text, isError, shouldSave) {
    var div = document.createElement('div');
    div.className = 'message ' + (role === 'user' ? 'user' : 'bot') + (isError ? ' error' : '');

    if (role !== 'user') {
      var label = document.createElement('span');
      label.className = 'label';
      label.innerText = 'TECHSAVVY AI';
      div.appendChild(label);

      if (isError) {
        div.appendChild(document.createTextNode(text));
      } else {
        div.appendChild(renderBotContent(text));
      }
    } else {
      div.innerText = text;
    }

    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;

    if (shouldSave && !isError) {
      saveToLocalStorage();
    }
    return div;
  }

  function showTypingIndicator() {
    var el = document.createElement('div');
    el.className = 'typing-indicator';
    el.id = 'typing-indicator';
    el.innerText = 'TECHSAVVY AI is thinking...';
    chatContainer.appendChild(el);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function removeTypingIndicator() {
    var el = document.getElementById('typing-indicator');
    if (el && el.parentNode) {
      el.parentNode.removeChild(el);
    }
  }

  messageInput.oninput = function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  };

  messageInput.onkeydown = function(e) {
    if (e.keyCode === 13 && !e.shiftKey) {
      if (e.preventDefault) e.preventDefault();
      sendMessage();
      return false;
    }
  };

  function sendViaXHR(payload) {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/chat', true);
    xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');

    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        sendBtn.disabled = false;
        removeTypingIndicator();

        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            conversationHistory.push({ role: 'assistant', content: data.reply });
            appendMessage('bot', data.reply, false, true);
          } catch (e) {
            appendMessage('bot', 'Error parsing server response.', true, false);
          }
        } else {
          conversationHistory.pop();
          appendMessage('bot', "oh noooooo! server error (" + xhr.status + "). check ur api key or try again! :(", true, false);
        }
      }
    };

    xhr.send(payload);
  }

  function sendMessage() {
    var text = messageInput.value.replace(/^\s+|\s+$/g, '');
    if (!text) return;

    var now = new Date().getTime();
    var elapsed = now - lastSentAt;
    if (elapsed < COOLDOWN_MS && lastSentAt !== 0) {
      var remaining = Math.ceil((COOLDOWN_MS - elapsed) / 1000);
      showCooldown(remaining);
      return;
    }
    lastSentAt = now;

    showChat();
    conversationHistory.push({ role: 'user', content: text });
    appendMessage('user', text, false, true);

    messageInput.value = '';
    messageInput.style.height = 'auto';
    sendBtn.disabled = true;
    showTypingIndicator();

    sendViaXHR(JSON.stringify({ messages: conversationHistory }));
  }

  menuBtn.onclick = openSidebar;
  closeSidebarBtn.onclick = closeSidebar;
  overlay.onclick = closeSidebar;
  newChatBtn.onclick = newChat;
  sendBtn.onclick = sendMessage;

  var suggestionBtns = document.querySelectorAll('.suggestion-item');
  for (var i = 0; i < suggestionBtns.length; i++) {
    suggestionBtns[i].onclick = function() {
      var prompt = this.getAttribute('data-prompt');
      closeSidebar();
      messageInput.value = prompt;
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
      sendMessage();
    };
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function() {
      document.body.style.height = window.visualViewport.height + 'px';
      if (chatContainer) {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    });
  }

  if (conversationHistory.length > 0) {
    showChat();
    for (var j = 0; j < conversationHistory.length; j++) {
      var msg = conversationHistory[j];
      appendMessage(msg.role === 'user' ? 'user' : 'bot', msg.content, false, false);
    }
  }
</script>
</body>
</html>
